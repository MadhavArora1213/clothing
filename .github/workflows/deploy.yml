name: Auto Deploy — Urban Outfit Collection

on:
  push:
    branches: [main]
    paths:
      # Trigger on ANY file change (code + uploads)
      - '**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── DEPLOY ───────────────────────────────────────────────
  deploy:
    name: Push to Server / Confirm Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Show what changed in this push ──
      - name: Show changed files
        run: |
          echo "=== Files changed in this push ==="
          git diff --name-only HEAD~1 HEAD || git show --stat HEAD
          echo ""
          echo "=== Upload files in this push ==="
          git diff --name-only HEAD~1 HEAD | grep "^uploads/" || echo "(no uploads in this push)"

      # ── PHP syntax check on changed files only ──
      - name: PHP Syntax Check
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD | grep '\.php$' || true)
          if [ -z "$changed" ]; then
            echo "No PHP files changed, skipping lint."
          else
            echo "$changed" | while read f; do
              echo "Checking $f..."
              php -l "$f" 2>&1 | grep -v "No syntax errors" || true
            done
          fi

      # ── Security: block .env from being committed ──
      - name: Block .env in repo
        run: |
          if git show HEAD:.env > /dev/null 2>&1; then
            echo "❌ ERROR: .env file found in commit! Remove it immediately."
            exit 1
          fi
          echo "✅ .env not in repo — safe."

      # ── Write deploy timestamp ──
      - name: Write build info
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHANGED_UPLOADS=$(git diff --name-only HEAD~1 HEAD | grep "^uploads/" | wc -l | tr -d ' ')
          CHANGED_PHP=$(git diff --name-only HEAD~1 HEAD | grep "\.php$" | wc -l | tr -d ' ')

          cat > .build-info <<EOF
          build:    ${{ github.sha }}
          branch:   ${{ github.ref_name }}
          pusher:   ${{ github.actor }}
          time:     $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          uploads:  ${CHANGED_UPLOADS} image(s) pushed
          php_files: ${CHANGED_PHP} file(s) changed
          EOF

          git add -f .build-info
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: build info [${{ github.sha }}] [skip ci]"
            git pull origin main --rebase
            git push
          fi

  # ─── NOTIFY ───────────────────────────────────────────────
  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Push successful — Urban Outfit Collection updated"
            echo "Commit : ${{ github.sha }}"
            echo "Pusher : ${{ github.actor }}"
            echo "Time   : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          else
            echo "❌ Deploy failed — check logs above"
          fi
